name: Cleanup past events

on:
  schedule:
    # Run every 12 hours at minute 0
    - cron: '0 */12 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  cleanup-past-events:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Remove past events
        run: |
          python remove_past_events.py > cleanup_output.txt 2>&1
          cat cleanup_output.txt

          # Pushes made with the workflow token don't trigger generate-ics.yml,
          # so the calendar feed is regenerated here as well
          python generate_ics.py

      - name: Commit and push changes
        run: |
          git add events.json events.ics

          if git diff --staged --quiet; then
            echo "No past events found"
          else
            REMOVED_COUNT=$(grep -c "^  - " cleanup_output.txt || echo "0")
            git commit -m "Remove $REMOVED_COUNT past event(s) from events.json"
            git push
          fi
